# Blueprint do Render: frontend (site estático, grátis)
services:
  - type: web
    name: nps-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false           # ex.: https://nps-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
